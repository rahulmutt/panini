[tools]
rust = { version = "1.97.1", components = "clippy,rustfmt" }

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all --check"

[tasks.mutants]
# --test-workspace=true is required: cargo-mutants otherwise defaults to
# running only the mutated package's own tests, which misses the
# `panini` crate's golden paradigm/trace/roundtrip tests that are the
# actual gate on the guarded rules in panini-prakriya.
#
# --timeout must clear a FULL, UNCAUGHT run of that workspace suite, not
# just a typical one. A caught mutant fails fast and is recorded quickly;
# an uncaught mutant runs the entire suite to completion before
# cargo-mutants can conclude nothing failed. At 1620 cells that full run
# (paradigm ~140s + roundtrip ~157s + trace, back to back) was already close
# to 300s, so a 300s cap no longer has headroom over the thing it is
# supposed to bound — it starts reclassifying genuine survivors as
# TIMEOUT instead of MISSED, which is the same vacuity a too-short cap
# always causes, just reached by suite growth instead of by an unset
# timeout. At 1728 cells (slice 7b) the same full uncaught run measures
# ~380s (paradigm ~183s + roundtrip ~196s + trace), so 1200s has better
# than 3x headroom -- AT LOW PARALLELISM. The cap must clear a full
# uncaught run at the parallelism actually used, and this line pins none:
# cargo-mutants reads -j from CARGO_MUTANTS_JOBS, so the environment can
# defeat the cap on its own. Slice 7b ran this gate at -j 16 on 24 cores
# and got 43 timeouts where one was expected; re-running exactly those at
# -j 4 --timeout 2400 caught 43 of 44 in 389-449s, i.e. 2.1-2.5x the ~183s
# those same caught mutants take standalone. -j 16 on 24 cores does not
# clear 1200s. Keep -j <= 4 with this cap, or raise the cap
# in step. Re-check both the floor and the margin whenever the golden
# suite grows again. It has: the ubhayapada 1.3.72 slice took the suite to
# 1800 cells, and a standalone `mise run test` there measured paradigm
# ~207s + roundtrip ~240s + trace ~2s -- an UNCONTENDED uncaught floor of
# ~450s, more than the ~395s a 4%-growth scaling predicts. No -j 4 run has
# been measured against that suite; applying 7b's 2.1-2.5x contention
# factor puts an uncaught mutant near 950-1100s, i.e. under this cap but
# without the ~3x margin the 1728-cell numbers showed. Adequate, not
# comfortable -- re-measure before trusting it further.
run = "cargo mutants --package panini-prakriya --test-workspace=true --timeout 1200"

[tasks.audit]
run = "cargo audit && cargo deny check"
