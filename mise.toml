[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all --check"

[tasks.mutants]
# --test-workspace=true is required: cargo-mutants otherwise defaults to
# running only the mutated packages' own tests, which misses the
# `panini` crate's golden paradigm/trace/roundtrip tests that are the
# actual gate on the guarded rules in panini-prakriya.
#
# --timeout must clear a FULL, UNCAUGHT run of the workspace suite at the
# parallelism actually used, and the slowest CAUGHT mutant's test phase too:
# a mutant that makes the vikalpa rules fork on every root (skip_nic -> true)
# blows up the derivation before any assertion fails. cargo-mutants reads -j
# from CARGO_MUTANTS_JOBS, so an unqualified cap can be defeated by the
# environment alone; keep -j <= 4.
#
# Under too short a cap a genuine survivor is recorded as a TIMEOUT rather
# than a MISSED, which makes a reported zero-survivor run vacuous. Always
# check `timeout.txt` alongside `missed.txt`.
#
# One timeout is correct and permanent: tripadi.rs's natva backward scan
# decrements with `j -= 1`, and the `j /= 1` mutant never terminates. No
# assertion can catch it -- the cap itself is the detection mechanism. Do not
# chase it with a bigger --timeout.
#
# The floor and margin behind this number are recorded in AGENTS.md's
# cargo-mutants paragraph, the single source for this reasoning. Re-check it
# whenever the golden suite grows.
run = "cargo mutants --package panini-prakriya --package panini-analyze --test-workspace=true --timeout 6470 -j 4"

[tasks.audit]
run = "cargo audit && cargo deny check"
