[tools]
rust = { version = "1.98.0", components = "clippy,rustfmt" }

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all --check"

[tasks.mutants]
# --test-workspace=true is required: cargo-mutants otherwise defaults to
# running only the mutated package's own tests, which misses the
# `panini` crate's golden paradigm/trace/roundtrip tests that are the
# actual gate on the guarded rules in panini-prakriya.
#
# --timeout must clear a FULL, UNCAUGHT run of the workspace suite at the
# parallelism actually used -- cargo-mutants reads -j from
# CARGO_MUTANTS_JOBS, so an unqualified cap can be defeated by the
# environment alone. Keep -j <= 4. The --timeout 2400 below is passed
# explicitly rather than left to cargo-mutants' own default: under too
# short a cap, a genuine survivor is recorded as a TIMEOUT rather than a
# MISSED, which makes a reported zero-survivor run vacuous, so always
# check `timeout.txt` alongside `missed.txt`.
#
# The measured floor and margin behind these numbers -- including the
# `-j 4` timing this gate now has at the current suite size -- are
# recorded in AGENTS.md's cargo-mutants paragraph, the single source for
# this reasoning. Re-check both there whenever the golden suite grows
# again.
#
# --timeout raised 2400 -> 4800 in slice 7e: the re-measured uncontended
# floor (945s at 2628 cells) projected a contended uncaught run at
# 1982-2360s, leaving only 1.7-21% margin under 2400 -- below this repo's
# own "adequate-but-unverified" bar. See AGENTS.md for the arithmetic.
run = "cargo mutants --package panini-prakriya --test-workspace=true --timeout 4800 -j 4"

[tasks.audit]
run = "cargo audit && cargo deny check"
